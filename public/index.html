<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📞 Laurence's AI Call Assistant</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 500px;
      width: 100%;
      padding: 40px;
      animation: slideIn 0.5s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      font-size: 2em;
      margin-bottom: 10px;
      color: #333;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
      font-size: 0.9em;
    }

    .form-group {
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #444;
      font-weight: 600;
      font-size: 0.95em;
    }

    input[type="text"],
    textarea,
    select {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 1em;
      transition: all 0.3s;
      font-family: inherit;
    }

    input[type="text"]:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      padding: 10px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .checkbox-item:hover {
      border-color: #667eea;
      background: #f8f9ff;
    }

    .checkbox-item input[type="checkbox"] {
      margin-right: 10px;
      width: 20px;
      height: 20px;
      cursor: pointer;
    }

    .btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.1em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      display: none;
    }

    .status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .status.info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }

    .emoji {
      font-size: 1.3em;
      margin-right: 5px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 25px;
      }
      
      h1 {
        font-size: 1.5em;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📞 Laurence's AI Call</h1>
    <p class="subtitle">Set up your AI-powered Telegram call in seconds</p>
    
    <form id="callForm">
      <div class="form-group">
        <label for="topic">💭 What's this call about?</label>
        <textarea 
          id="topic" 
          name="topic" 
          placeholder="e.g., UC admin tasks, ADHD planning, brain dump about client work..."
          required
        ></textarea>
      </div>

      <div class="form-group">
        <label for="botMode">🤖 Bot Behavior</label>
        <select id="botMode" name="botMode" required>
          <option value="listener">Just Listen & Summarize</option>
          <option value="coach">Ask Questions & Keep Me On Track</option>
          <option value="planner">Turn This Into Tasks & Deadlines</option>
          <option value="therapist">Reflective & Supportive Conversation</option>
        </select>
      </div>

      <div class="form-group">
        <label>📤 Where should I send the results?</label>
        <div class="checkbox-group">
          <label class="checkbox-item">
            <input type="checkbox" name="output" value="telegram" checked>
            <span>💬 Telegram Messages</span>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" name="output" value="email">
            <span>📧 Email (lostone@gmail.com)</span>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" name="output" value="pdf">
            <span>📄 PDF Document in Telegram</span>
          </label>
        </div>
      </div>

      <div class="form-group">
        <label for="timing">⏰ When should I call?</label>
        <select id="timing" name="timing" required>
          <option value="now">📞 Call Me NOW!</option>
          <option value="5">🕐 In 5 minutes</option>
          <option value="10">🕐 In 10 minutes</option>
          <option value="30">🕐 In 30 minutes</option>
        </select>
      </div>

      <button type="submit" class="btn" id="submitBtn">
        <span class="emoji">🚀</span> Start Session
      </button>
    </form>

    <div class="status" id="status"></div>
  </div>

  <script>
    const form = document.getElementById('callForm');
    const submitBtn = document.getElementById('submitBtn');
    const status = document.getElementById('status');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      // Get form data
      const topic = document.getElementById('topic').value;
      const botMode = document.getElementById('botMode').value;
      const timing = document.getElementById('timing').value;
      
      // Get selected outputs
      const outputs = Array.from(document.querySelectorAll('input[name="output"]:checked'))
        .map(cb => cb.value);

      if (outputs.length === 0) {
        showStatus('Please select at least one output method', 'error');
        return;
      }

      // Prepare request
      const data = {
        topic,
        botMode,
        outputs,
        timing: timing === 'now' ? 0 : parseInt(timing)
      };

      // Disable button
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="emoji">⏳</span> Setting up your call...';

      try {
        const response = await fetch('/api/schedule-call', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (response.ok) {
          const timingText = timing === 'now' 
            ? 'Your phone should ring any second!' 
            : `Call scheduled in ${timing} minutes!`;
          showStatus(`✅ ${timingText}`, 'success');
          form.reset();
        } else {
          showStatus(`❌ Error: ${result.error || 'Something went wrong'}`, 'error');
        }
      } catch (error) {
        showStatus(`❌ Error: ${error.message}`, 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span class="emoji">🚀</span> Start Session';
      }
    });

    function showStatus(message, type) {
      status.textContent = message;
      status.className = `status ${type}`;
      status.style.display = 'block';
      
      setTimeout(() => {
        status.style.display = 'none';
      }, 5000);
    }

    // Show URL info on load
    window.addEventListener('load', () => {
      const url = window.location.href;
      console.log('📞 Laurence Call UI loaded at:', url);
      console.log('Memorize this URL to access from anywhere!');
    });
  </script>
</body>
</html>
